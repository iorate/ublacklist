# Uploads sources to Crowdin and merges the exported translations back right
# away, without changesets, so that the English fallbacks Crowdin fills in for
# new keys do not show up as translation updates in Crowdin Download.
# Approved translations pending on Crowdin get merged here without changesets
# too; dispatch Crowdin Download first if there are any.

name: Crowdin Upload

on:
  push:
    branches:
      - master
    paths:
      - crowdin.yml
      - src/_locales/en/messages.json
      - README.md
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}

jobs:
  upload:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate token for pull request
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Exclude README translations not yet merged
        run: cat .github/crowdin.gitignore >> .git/info/exclude

      - name: Run crowdin
        id: crowdin
        uses: crowdin/github-action@72955432d4aa4f6dd64cf17eeb88dd34d6ba064c # v3.4.0
        with:
          download_translations: true
          export_only_approved: true
          download_translations_args: --ignore-match
          commit_message: Import translations from Crowdin
          pull_request_title: Import translations from Crowdin
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Enable auto-merge
        if: ${{ steps.crowdin.outputs.pull_request_number }}
        run: gh pr merge --squash --auto "$PULL_REQUEST_NUMBER"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ steps.crowdin.outputs.pull_request_number }}
