# Downloads approved translations from Crowdin and opens a pull request with a
# changeset for each updated language. Dispatch it before changing the sources,
# or Crowdin Upload merges the pending translations without changesets.

name: Crowdin Download

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}

env:
  LOCALIZATION_BRANCH_NAME: crowdin-download-${{ github.run_id }}

jobs:
  download:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate token for pull request
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Exclude README translations not yet merged
        run: cat .github/crowdin-git-exclude >> .git/info/exclude

      - name: Run crowdin
        id: crowdin
        uses: crowdin/github-action@71fdb8814261dd703be4ca7c6450d21b1868da4b # v3.0.1
        with:
          upload_sources: false
          download_translations: true
          export_only_approved: true
          download_translations_args: --ignore-match
          localization_branch_name: ${{ env.LOCALIZATION_BRANCH_NAME }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    outputs:
      pull_request_number: ${{ steps.crowdin.outputs.pull_request_number }}

  changeset:
    needs: download

    if: ${{ needs.download.outputs.pull_request_number }}

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.LOCALIZATION_BRANCH_NAME }}
          fetch-depth: 2

      # HEAD^ is master. The changeset file name is fixed per language so that
      # repeated runs before a release keep a single changelog entry.
      - name: Create changeset
        run: |
          language_codes=$(git diff --name-only HEAD^ | sed -n 's#src/_locales/\([^/]*\)/messages\.json#\1#p')
          for language_code in $language_codes; do
            language=$(node -p 'new Intl.DisplayNames(["en"], { type: "language" }).of(process.argv[1].replaceAll("_", "-"))' "$language_code")
            cat > ".changeset/update-$language_code-translation.md" << EOF
          ---
          "ublacklist": patch
          ---

          Updated the $language translation.
          EOF
          done

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit changes
        uses: suzuki-shunsuke/commit-action@06e3b49d4706498d325d29bd85adc82ecf2f5d8f # v1.0.0
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          branch: ${{ env.LOCALIZATION_BRANCH_NAME }}
          commit_message: Update changesets
          fail_on_self_push: false

      - name: Enable auto-merge
        run: gh pr merge --squash --auto "$PULL_REQUEST_NUMBER"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ needs.download.outputs.pull_request_number }}
