pre-commit:
  # Run serially: parallel `pnpm` invocations race on pnpm's deps-status check.
  jobs:
    - name: oxlint
      run: pnpm oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
